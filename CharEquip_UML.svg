<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 660" style="background:#ffffff; font-family: sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="diamond-open" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="12" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 5L7 1L13 5L7 9Z" fill="none" stroke="#555" stroke-width="1.2"/>
  </marker>
  <marker id="diamond-filled" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="12" markerHeight="8" orient="auto-start-reverse">
    <path d="M1 5L7 1L13 5L7 9Z" fill="#555" stroke="#555" stroke-width="1.2"/>
  </marker>
</defs>

<!-- ── Characters ── -->
<!-- Char 1 -->
<rect x="40" y="30" width="160" height="44" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="120" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Character 1</text>

<!-- Char 2 -->
<rect x="260" y="30" width="160" height="44" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Character 2</text>

<!-- Char 3 -->
<rect x="480" y="30" width="160" height="44" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="560" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Character 3</text>

<!-- ── Equipment ── -->
<rect x="240" y="190" width="200" height="76" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
<text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#26215C">Equipment</text>
<text x="340" y="226" text-anchor="middle" dominant-baseline="central" font-size="12" font-style="italic" fill="#534AB7">«set»</text>
<line x1="240" y1="236" x2="440" y2="236" stroke="#7F77DD" stroke-width="0.5"/>
<text x="254" y="252" dominant-baseline="central" font-size="12" fill="#3C3489">+ equipmentId : str</text>

<!-- ── Character → Equipment associations ── -->
<!-- Char1 -->
<path d="M120 74 L120 160 L260 160 L260 190" fill="none" stroke="#555" stroke-width="1" marker-start="url(#diamond-open)"/>
<text x="124" y="90" font-size="12" fill="#888">*</text>
<text x="238" y="186" text-anchor="end" font-size="12" fill="#888">1</text>

<!-- Char2 -->
<path d="M340 74 L340 190" fill="none" stroke="#555" stroke-width="1" marker-start="url(#diamond-open)"/>
<text x="344" y="92" font-size="12" fill="#888">*</text>
<text x="344" y="186" font-size="12" fill="#888">1</text>

<!-- Char3 -->
<path d="M560 74 L560 160 L420 160 L420 190" fill="none" stroke="#555" stroke-width="1" marker-start="url(#diamond-open)"/>
<text x="545" y="90" font-size="12" fill="#888">*</text>
<text x="424" y="186" font-size="12" fill="#888">1</text>

<!-- ── Equipment → Pieces composition ── -->
<line x1="340" y1="266" x2="340" y2="340" stroke="#555" stroke-width="1" marker-start="url(#diamond-filled)"/>
<line x1="57"  y1="340" x2="622" y2="340" stroke="#555" stroke-width="1"/>
<line x1="57"  y1="340" x2="57"  y2="390" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="167" y1="340" x2="167" y2="390" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="277" y1="340" x2="277" y2="390" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="402" y1="340" x2="402" y2="390" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="512" y1="340" x2="512" y2="390" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="622" y1="340" x2="622" y2="390" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>

<!-- multiplicity -->
<text x="344" y="278" font-size="12" fill="#888">1</text>
<text x="48"  y="386" text-anchor="middle" font-size="12" fill="#888">*</text>
<text x="158" y="386" text-anchor="middle" font-size="12" fill="#888">*</text>
<text x="268" y="386" text-anchor="middle" font-size="12" fill="#888">*</text>
<text x="393" y="386" text-anchor="middle" font-size="12" fill="#888">*</text>
<text x="503" y="386" text-anchor="middle" font-size="12" fill="#888">*</text>
<text x="613" y="386" text-anchor="middle" font-size="12" fill="#888">*</text>

